{% extends "base.html" %}

{% block title %}Log in &middot; Mentor{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-2xl font-semibold tracking-tight">Mentor</h1>
  <p class="mt-1 text-sm text-stone-500">Log in to see what needs reordering.</p>

  <form method="post" class="mt-6 space-y-4 bg-white p-6 rounded-lg border border-stone-200">
    {% csrf_token %}

    {% if form.non_field_errors %}
      <p class="text-sm text-red-600">{{ form.non_field_errors|first }}</p>
    {% endif %}

    <div>
      <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium">Username</label>
      <input type="text" name="username" id="{{ form.username.id_for_label }}" autofocus required
             class="mt-1 w-full rounded-md border border-stone-300 px-3 py-3 text-base focus:border-[#71a07c] focus:outline-none">
    </div>

    <div>
      <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium">Password</label>
      <input type="password" name="password" id="{{ form.password.id_for_label }}" required
             class="mt-1 w-full rounded-md border border-stone-300 px-3 py-3 text-base focus:border-[#71a07c] focus:outline-none">
    </div>

    <button type="submit"
            class="min-h-11 w-full rounded-md bg-[#4a7355] px-4 text-base text-white hover:bg-[#3d6047]">
      Log in
    </button>
  </form>
</div>
{% endblock %}
