{% extends "base.html" %}

{% block title %}Units &middot; Mentor{% endblock %}

{% block content %}
<div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-3">
  <div>
    <a href="{% url 'products' %}"
       class="text-sm text-stone-500 underline decoration-stone-300 underline-offset-4 hover:text-stone-900">
      &larr; Products
    </a>
    <h1 class="mt-1 text-2xl font-semibold tracking-tight">Units</h1>
  </div>

  <button type="button"
          hx-get="{% url 'new_unit' %}"
          hx-target="#modal-body"
          hx-swap="innerHTML"
          hx-on::after-request="document.getElementById('modal').showModal()"
          class="rounded-md bg-[#4a7355] px-4 py-2.5 text-base text-white hover:bg-[#3d6047]">
    Add unit
  </button>
</div>

{% include "orders/_unit_list.html" %}

{% comment %}
  Outside the swapped list so an htmx swap cannot tear the dialog down while
  someone is working in it.
{% endcomment %}
<dialog id="modal">
  <div id="modal-body"></div>
</dialog>
{% endblock %}
