{% extends "base.html" %}

{% block title %}Order list &middot; Mentor{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold tracking-tight mb-4">Order list</h1>

{% include "orders/_panel.html" %}

<script>
// Drives the product dropdown. Lives outside #panel so it survives the htmx
// swaps, and looks elements up on each use since the panel replaces them.
(function () {
  const HIGHLIGHT = "bg-stone-100";
  let active = -1;

  const search = () => document.getElementById("product-search");
  const results = () => document.getElementById("product-results");
  const options = () => Array.from(results().querySelectorAll(".search-result"));

  function highlight(index) {
    const opts = options();
    active = opts.length ? (index + opts.length) % opts.length : -1;
    opts.forEach((el, i) => el.classList.toggle(HIGHLIGHT, i === active));
    if (opts[active]) opts[active].scrollIntoView({ block: "nearest" });
  }

  function close() {
    results().innerHTML = "";
    active = -1;
  }

  // Lock in a product, then jump to quantity so an item can be added without
  // ever touching the mouse.
  window.selectProduct = function (id, name) {
    document.getElementById("product-id").value = id;
    search().value = name;
    close();
    document.getElementById("quantity").focus();
  };

  // Fresh results arrive pre-highlighted, so Enter takes the best match.
  document.body.addEventListener("htmx:afterSwap", function (event) {
    if (event.target.id === "product-results") highlight(0);
  });

  document.addEventListener("keydown", function (event) {
    if (document.activeElement !== search() || !options().length) return;

    if (event.key === "ArrowDown") {
      event.preventDefault();
      highlight(active + 1);
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      highlight(active - 1);
    } else if (event.key === "Enter" && active >= 0) {
      // Pick the highlighted product instead of submitting a blank form.
      event.preventDefault();
      options()[active].click();
    } else if (event.key === "Escape") {
      close();
    }
  });

  document.addEventListener("click", function (event) {
    if (!event.target.closest("#product-search") && !event.target.closest("#product-results")) {
      close();
    }
  });
})();
</script>
{% endblock %}
