{% for product in products %}
  <button type="button"
          onclick="selectProduct({{ product.pk }}, '{{ product.name|escapejs }}')"
          class="block w-full px-3 py-2 text-left hover:bg-stone-100">
    <span class="font-medium">{{ product.name }}</span>
    <span class="text-sm text-stone-500">
      &middot; {{ product.seller.name }} &middot; &euro;{{ product.unit_price|floatformat:2 }}/{{ product.unit }}
    </span>
  </button>
{% empty %}
  {% if query %}
    <p class="px-3 py-2 text-sm text-stone-500">No product matches “{{ query }}”.</p>
  {% endif %}
{% endfor %}
