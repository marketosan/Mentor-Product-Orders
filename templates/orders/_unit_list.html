{% comment %}
  The list on its own, so saving from the dialog swaps just this.
{% endcomment %}
<div id="unit-list" class="mt-4 divide-y divide-stone-200 overflow-hidden rounded-lg border border-stone-200 bg-white">
  {% for unit in units %}
    <div class="flex flex-wrap items-center gap-x-3 gap-y-2 px-4 py-3.5">
      <div class="min-w-0 flex-1">
        <span class="font-medium leading-snug text-stone-900">{{ unit.name }}</span>
        <span class="ml-2 text-sm text-stone-500">{{ unit.plural }}</span>
      </div>

      <div class="flex w-full shrink-0 items-center justify-end gap-0.5 sm:w-auto">
        <button hx-get="{% url 'edit_unit' unit.pk %}"
                hx-target="#modal-body" hx-swap="innerHTML"
                hx-on::after-request="document.getElementById('modal').showModal()"
                aria-label="Edit {{ unit.name }}" title="Edit"
                class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-md text-stone-400 hover:bg-stone-100 hover:text-stone-900">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </button>
      </div>
    </div>
  {% empty %}
    <div class="px-4 py-12 text-center">
      <p class="font-medium text-stone-700">No units yet</p>
      <p class="mt-1 text-sm text-stone-500">
        Products cannot be added until the shop has at least one unit.
      </p>
    </div>
  {% endfor %}
</div>
